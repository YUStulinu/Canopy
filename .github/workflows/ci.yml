name: CI

on:
  push:
  pull_request:

jobs:
  python:
    # The model, metrics, indices and grids; no imagery is downloaded in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  tiles:
    # The Rust tile server: coordinates against PROJ, .npy parsing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tiles
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release

  change:
    # The Go change API: change masks, patches, coordinates.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: change
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: change/go.mod
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
